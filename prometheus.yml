global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'callcenterai-monitor'

scrape_configs:
  # Transformer Service
  - job_name: 'transformer'
    static_configs:
      - targets: ['transformer:8001']
        labels:
          service: 'transformer'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TF-IDF Service
  - job_name: 'tfidf'
    static_configs:
      - targets: ['tfidf:8002']
        labels:
          service: 'tfidf'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Agent Service
  - job_name: 'agent'
    static_configs:
      - targets: ['agent:8000']
        labels:
          service: 'agent'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']